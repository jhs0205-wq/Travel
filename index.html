<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 여정 아카이브 | 블로그형 기록장</title>
    <style>
        /* 기본 스타일 및 웹폰트 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f8fafc; color: #334155; padding: 30px 15px; }
        .container { max-width: 1000px; margin: 0 auto; }

        /* 블로그 타이틀 헤더 */
        header { text-align: center; margin-bottom: 40px; padding: 20px 0; border-bottom: 2px solid #e2e8f0; }
        header h1 { font-size: 2.4rem; color: #0f172a; font-weight: 800; letter-spacing: -0.02em; }
        header p { color: #64748b; margin-top: 8px; font-size: 1.05rem; }

        /* 블로그형 상세 검색 필터 바 */
        .filter-section {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            margin-bottom: 35px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid #e2e8f0;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px; }
        .filter-group label { font-size: 0.8rem; font-weight: 700; color: #64748b; letter-spacing: 0.05em; }
        .filter-group select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #fff;
            font-size: 0.95rem;
            color: #334155;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-group select:focus { border-color: #3b82f6; }

        /* 블로그 스타일 글 목록 그리드 */
        .record-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }
        .blog-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .blog-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.06); }

        /* 다중 이미지 슬라이더 영역 */
        .image-slider {
            position: relative;
            width: 100%;
            height: 230px;
            background-color: #f1f5f9;
            overflow: hidden;
        }
        .slider-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slider-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .slider-btn.prev { left: 12px; }
        .slider-btn.next { right: 12px; }
        
        .image-counter {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.75);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* 블로그 내용 본문 스타일 */
        .card-body { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .badge {
            align-self: flex-start;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .badge.식당 { background-color: #fee2e2; color: #991b1b; }
        .badge.숙소 { background-color: #fef9c3; color: #854d0e; }
        .badge.명소 { background-color: #dcfce7; color: #166534; }

        .card-title { font-size: 1.35rem; color: #0f172a; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
        
        /* 🗺️ 국가 / 도 / 시 분리 경로 태그 구조 */
        .card-breadcrumbs { font-size: 0.82rem; color: #3b82f6; font-weight: 600; margin-bottom: 14px; display: flex; gap: 4px; align-items: center; }
        .card-breadcrumbs span { background: #eff6ff; padding: 2px 6px; border-radius: 4px; }

        .card-review { font-size: 0.95rem; color: #475569; line-height: 1.6; flex-grow: 1; text-align: justify; }
        
        .card-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-stars { color: #f59e0b; font-size: 0.95rem; }
        .card-date { font-size: 0.8rem; color: #94a3b8; font-weight: 500; }

        .no-data { grid-column: 1/-1; text-align: center; color: #64748b; padding: 60px 0; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📝 My Travel Log</h1>
        <p>전 세계 방방곡곡 맛집, 숙소, 명소들을 기록하는 개인 블로그</p>
    </header>

    <div class="filter-section">
        <div class="filter-group">
            <label>국가 (Country)</label>
            <select id="filter-country" onchange="filterData()">
                <option value="all">전체 국가</option>
                <option value="한국">한국 🇰🇷</option>
                <option value="일본">일본 🇯🇵</option>
            </select>
        </div>
        <div class="filter-group">
            <label>도 / 광역시 (State/Province)</label>
            <select id="filter-state" onchange="filterData()">
                <option value="all">전체 지역(도)</option>
                <option value="경기도">경기도</option>
                <option value="부산광역시">부산광역시</option>
                <option value="도쿄도">도쿄도</option>
            </select>
        </div>
        <div class="filter-group">
            <label>시 / 군 / 구 (City)</label>
            <select id="filter-city" onchange="filterData()">
                <option value="all">전체 세부도시</option>
                <option value="포천시">포천시</option>
                <option value="수영구">수영구</option>
                <option value="신주쿠구">신주쿠구</option>
            </select>
        </div>
        <div class="filter-group">
            <label>카테고리</label>
            <select id="filter-category" onchange="filterData()">
                <option value="all">전체 종류</option>
                <option value="식당">음식점 🍕</option>
                <option value="숙소">숙박업소 🏨</option>
                <option value="명소">관광명소 🎡</option>
            </select>
        </div>
    </div>

    <div class="record-grid" id="record-grid"></div>
</div>

<script>
    // 📝 [블로그 데이터 기입장]
    // 국가(country), 도/광역시(state), 시/군/구(city)를 자유롭게 텍스트로 적어 넣으시면 됩니다.
    const travelData = [
        {
            id: 1,
            category: "명소",
            name: "포천 아트밸리",
            // ⭐️ 요청하신 대로 지역 데이터를 단계별로 세분화했습니다.
            country: "한국",
            state: "경기도",
            city: "포천시",
            date: "2026.05.22",
            // 📸 원하는 만큼 이미지 주소를 넣을 수 있습니다.
            images: [
                "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600",
                "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600"
            ],
            review: "버려진 채석장을 친환경 문화예술 공간으로 재탄생시킨 곳입니다. 에메랄드빛 호수와 화강암 절벽의 조화가 무척 아름다우며, 모노레일을 타고 편하게 올라갈 수 있어 가족 여행지로 안성맞춤입니다.",
            stars: "⭐⭐⭐⭐⭐"
        },
        {
            id: 2,
            category: "식당",
            name: "신주쿠 타츠노야 츠케멘",
            country: "일본",
            state: "도쿄도",
            city: "신주쿠구",
            date: "2026.04.12",
            images: [
                "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=600",
                "https://images.unsplash.com/photo-1618411640018-97108d48db74?w=600"
            ],
            review: "진한 곱창 소스에 면을 찍어 먹는 독특한 츠케멘 맛집입니다. 면을 다 먹은 후에 소스 그릇을 건네며 죽(카유)을 만들어 달라고 하면 고소하게 끓여주는데 이게 화룡점정입니다.",
            stars: "⭐⭐⭐⭐⭐"
        },
        {
            id: 3,
            category: "명소",
            name: "광안리 해수욕장",
            country: "한국",
            state: "부산광역시",
            city: "수영구",
            date: "2026.05.01",
            images: [
                "https://images.unsplash.com/photo-1590301157890-4810ed352733?w=600"
            ],
            review: "밤에 켜지는 광안대교 다리의 조명 야경이 아주 낭만적입니다. 매주 토요일 저녁 해변가에서 진행되는 대형 드론 라이트쇼는 놓치지 말고 꼭 감상해야 할 필수 코스입니다.",
            stars: "⭐⭐⭐⭐⭐"
        }
    ];

    // 슬라이더 제어 로직 함수
    const sliderStates = {};

    function initSlider(id, max) {
        sliderStates[id] = { current: 0, max: max };
    }

    function changeSlide(id, step) {
        const state = sliderStates[id];
        if (!state) return;

        state.current += step;
        if (state.current < 0) state.current = state.max;
        if (state.current > state.max) state.current = 0;

        const wrapper = document.getElementById(`slider-wrap-${id}`);
        const counter = document.getElementById(`counter-${id}`);
        
        wrapper.style.transform = `translateX(-${state.current * 100}%)`;
        counter.textContent = `${state.current + 1} / ${state.max + 1}`;
    }

    // 카드 출력 렌더링 시스템
    function renderBlogCards(data) {
        const grid = document.getElementById('record-grid');
        grid.innerHTML = '';

        if(data.length === 0) {
            grid.innerHTML = `<div class="no-data">🔍 검색 조건에 맞는 블로그 글이 존재하지 않습니다.</div>`;
            return;
        }

        data.forEach(item => {
            const imgLen = item.images ? item.images.length : 0;
            if (imgLen > 0) initSlider(item.id, imgLen - 1);

            const card = document.createElement('div');
            card.className = 'blog-card';
            
            let imgBlock = '';
            if (imgLen > 0) {
                imgBlock = `
                    <div class="image-slider">
                        <div class="slider-wrapper" id="slider-wrap-${item.id}">
                            ${item.images.map(src => `<img src="${src}" alt="${item.name}">`).join('')}
                        </div>
                        ${imgLen > 1 ? `
                            <button class="slider-btn prev" onclick="changeSlide(${item.id}, -1)">‹</button>
                            <button class="slider-btn next" onclick="changeSlide(${item.id}, 1)">›</button>
                            <div class="image-counter" id="counter-${item.id}">1 / ${imgLen}</div>
                        ` : ''}
                    </div>
                `;
            }

            card.innerHTML = `
                ${imgBlock}
                <div class="card-body">
                    <span class="badge ${item.category}">${item.category}</span>
                    <h3 class="card-title">${item.name}</h3>
                    <div class="card-breadcrumbs">
                        <span>${item.country}</span> &gt; <span>${item.state}</span> &gt; <span>${item.city}</span>
                    </div>
                    <p class="card-review">${item.review}</p>
                    <div class="card-footer">
                        <div class="card-stars">${item.stars}</div>
                        <div class="card-date">${item.date}</div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 네 단계의 조건부 필터링 엔진
    function filterData() {
        const country = document.getElementById('filter-country').value;
        const state = document.getElementById('filter-state').value;
        const city = document.getElementById('filter-city').value;
        const category = document.getElementById('filter-category').value;

        const filtered = travelData.filter(item => {
            const countryMatch = (country === 'all' || item.country === country);
            const stateMatch = (state === 'all' || item.state === state);
            const cityMatch = (city === 'all' || item.city === city);
            const categoryMatch = (category === 'all' || item.category === category);
            
            return countryMatch && stateMatch && cityMatch && categoryMatch;
        });

        renderBlogCards(filtered);
    }

    // 페이지 진입 초기 로딩
    window.onload = function() {
        renderBlogCards(travelData);
    };
</script>

</body>
</html>
