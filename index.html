<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리의 특별한 여행 블로그</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
                ✈️ 여행 블로그
            </h1>
            <div id="auth-section">
                <button id="btn-login" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                    구글 로그인
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 mt-6">
        
        <section id="write-section" class="bg-white p-6 rounded-xl shadow-md mb-8 hidden">
            <h3 class="text-lg font-bold mb-4 text-gray-800">새로운 여행 추억 남기기 📝</h3>
            <div class="space-y-4">
                <input type="text" id="post-title" placeholder="여행지 또는 제목을 입력하세요" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                <textarea id="post-content" rows="4" placeholder="어떤 즐거운 일이 있었나요? 자유롭게 적어보세요!" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
                <button id="btn-submit" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600 transition">
                    소중한 추억 저장하기 📌
                </button>
            </div>
        </section>

        <section>
            <h3 class="text-xl font-bold mb-6 text-gray-800">모두의 여행 이야기 🌍</h3>
            <div id="post-list" class="space-y-6">
                <div class="text-center text-gray-500 py-12">여행 기록을 불러오는 중입니다... 🔄</div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔗 한서님의 고유 파이어베이스 정보와 실시간 데이터베이스 주소가 결합된 설정입니다.
        const firebaseConfig = {
            apiKey: "AIzaSyCqDopsGReKPSqnwtZeHoHi86QmnzUtVSk",
            authDomain: "travel-blog-f0bdd.firebaseapp.com",
            databaseURL: "https://travel-blog-f0bdd-default-rtdb.asia-southeast1.firebasedatabase.app/", 
            projectId: "travel-blog-f0bdd",
            storageBucket: "travel-blog-f0bdd.firebasestorage.app",
            messagingSenderId: "603563736434",
            appId: "1:603563736434:web:adf85d05b5fd1e6ca5b1eb",
            measurementId: "G-YXB4924FB3"
        };

        // 시스템 기동
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const btnLogin = document.getElementById('btn-login');
        const authSection = document.getElementById('auth-section');
        const writeSection = document.getElementById('write-section');
        const btnSubmit = document.getElementById('btn-submit');
        const postList = document.getElementById('post-list');

        let currentUser = null;

        // 로그인 상태 감지
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authSection.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${user.photoURL}" class="w-8 h-8 rounded-full shadow">
                        <span class="font-medium text-gray-700 text-sm hidden sm:inline">${user.displayName}님</span>
                        <button id="btn-logout" class="text-xs text-red-500 border border-red-200 px-2 py-1 rounded hover:bg-red-50">로그아웃</button>
                    </div>
                `;
                writeSection.classList.remove('hidden');
                document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
            } else {
                currentUser = null;
                authSection.innerHTML = `<button id="btn-login-dynamic" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">구글 로그인</button>`;
                writeSection.classList.add('hidden');
                document.getElementById('btn-login-dynamic').addEventListener('click', () => signInWithPopup(auth, provider));
            }
        });

        if(btnLogin) {
            btnLogin.addEventListener('click', () => signInWithPopup(auth, provider));
        }

        // 글 저장 로직
        btnSubmit.addEventListener('click', () => {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();

            if (!title || !content) {
                alert('제목과 내용을 모두 적어주세요! ✍️');
                return;
            }

            push(ref(db, 'posts'), {
                title: title,
                content: content,
                userName: currentUser.displayName,
                userPhoto: currentUser.photoURL,
                createdAt: new Date().toLocaleString()
            }).then(() => {
                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
                alert('추억이 성공적으로 저장되었습니다! 🎉');
            }).catch((error) => {
                alert('저장 실패: 규칙 설정을 다시 확인해보세요!');
                console.error(error);
            });
        });

        // 글 불러오기 로직
        onValue(ref(db, 'posts'), (snapshot) => {
            postList.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                postList.innerHTML = `<div class="text-center text-gray-400 py-12">아직 작성된 여행 이야기가 없어요. 첫 번째 주인공이 되어보세요! 🧳</div>`;
                return;
            }

            const keys = Object.keys(data).reverse();
            keys.forEach(key => {
                const post = data[key];
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-xl shadow-md border border-gray-100 flex flex-col gap-4';
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-3">
                        <div class="flex items-center gap-3">
                            <img src="${post.userPhoto}" class="w-9 h-9 rounded-full border">
                            <div>
                                <h4 class="font-bold text-gray-800 text-base">${post.title}</h4>
                                <p class="text-xs text-gray-500">${post.userName}</p>
                            </div>
                        </div>
                        <span class="text-xs text-gray-400 bg-gray-50 px-2 py-1 rounded">${post.createdAt}</span>
                    </div>
                    <p class="text-gray-700 whitespace-pre-wrap leading-relaxed text-sm">${post.content}</p>
                `;
                postList.appendChild(card);
            });
        });
    </script>
</body>
</html>
