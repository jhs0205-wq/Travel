<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 특별한 여행 기록장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent flex items-center gap-2">
                ✈️ 나의 여행 다이어리
            </h1>
            <div class="w-full sm:w-80 relative">
                <input type="text" id="search-input" placeholder="어디로 떠나셨나요? (국가, 도시 검색)" class="w-full pl-4 pr-10 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition text-sm">
                <span class="absolute right-3 top-2.5 text-slate-400 text-sm">🔍</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 mt-8">
        
        <section class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm mb-10">
            <div class="flex items-center gap-2 mb-6">
                <span class="text-xl">📸</span>
                <h3 class="text-lg font-bold text-slate-800">새로운 여행 추억 기록하기</h3>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-2">위치 정보</label>
                    <div class="grid grid-cols-3 gap-3">
                        <input type="text" id="post-country" placeholder="국가 (예: 대한민국)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition">
                        <input type="text" id="post-state" placeholder="도/주 (예: 경기도)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition">
                        <input type="text" id="post-city" placeholder="시/군/구 (예: 고양시)" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-2">여행 제목</label>
                        <input type="text" id="post-title" placeholder="이번 여행을 한 줄로 표현한다면?" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-2">여행 경험 및 스토리</label>
                        <textarea id="post-content" rows="4" placeholder="어떤 특별한 경험을 하셨나요? 자유롭게 적어보세요!" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition"></textarea>
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-2">여행 사진 링크 (여러 장 가능)</label>
                    <div class="border border-slate-200 p-4 rounded-xl bg-slate-50">
                        <input type="text" id="post-images" placeholder="이미지 주소들을 쉼표(,)로 구분해서 입력하세요 (예: 주소1, 주소2)" class="w-full p-3 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:border-blue-500 transition">
                        <p class="text-[11px] text-slate-400 mt-2 flex items-center gap-1">
                            ℹ️ 첫 번째로 입력한 사진 주소가 타일의 대표 이미지가 됩니다.
                        </p>
                    </div>
                </div>

                <button id="btn-submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 rounded-xl font-medium shadow-md shadow-blue-500/10 hover:opacity-9s0 transition text-sm font-bold">
                    나의 추억 저장하기 💾
                </button>
            </div>
        </section>

        <section>
            <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center gap-2">
                <span>🗺️</span> 내가 가본 여행지 목록
            </h3>
            <div id="post-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full text-center text-slate-400 py-12">기록을 불러오는 중입니다... 🔄</div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqDopsGReKPSqnwtZeHoHi86QmnzUtVSk",
            authDomain: "travel-blog-f0bdd.firebaseapp.com",
            databaseURL: "https://travel-blog-f0bdd-default-rtdb.asia-southeast1.firebasedatabase.app/", 
            projectId: "travel-blog-f0bdd",
            storageBucket: "travel-blog-f0bdd.firebasestorage.app",
            messagingSenderId: "603563736434",
            appId: "1:603563736434:web:adf85d05b5fd1e6ca5b1eb",
            measurementId: "G-YXB4924FB3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const btnSubmit = document.getElementById('btn-submit');
        const postList = document.getElementById('post-list');
        const searchInput = document.getElementById('search-input');

        let allPosts = [];

        // 데이터 저장하기
        btnSubmit.addEventListener('click', () => {
            const country = document.getElementById('post-country').value.trim();
            const state = document.getElementById('post-state').value.trim();
            const city = document.getElementById('post-city').value.trim();
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const imagesInput = document.getElementById('post-images').value.trim();

            if (!country || !city || !title || !content) {
                alert('국가, 시, 제목, 내용은 꼭 입력해 주세요! ✍️');
                return;
            }

            let imageArray = [];
            if (imagesInput) {
                imageArray = imagesInput.split(',').map(url => url.trim()).filter(url => url !== '');
            } else {
                imageArray = ["https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800"];
            }

            push(ref(db, 'my_posts'), {
                country, state, city, title, content,
                images: imageArray,
                mainImage: imageArray[0],
                createdAt: new Date().toLocaleDateString()
            }).then(() => {
                document.getElementById('post-country').value = '';
                document.getElementById('post-state').value = '';
                document.getElementById('post-city').value = '';
                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
                document.getElementById('post-images').value = '';
                alert('기록이 안전하게 저장되었습니다! 🎉');
            });
        });

        // 카드 화면에 그리기
        function displayPosts(posts) {
            postList.innerHTML = '';

            if (posts.length === 0) {
                postList.innerHTML = `<div class="col-span-full text-center text-slate-400 py-12">작성된 기록이 없거나 일치하는 여행지가 없습니다. 🧭</div>`;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden flex flex-col group hover:shadow-md transition-all duration-300';
                
                //전체 사진 썸네일 노출
                let allImagesHtml = '';
                post.images.forEach(imgUrl => {
                    allImagesHtml += `
                        <div class="w-12 h-12 rounded-lg overflow-hidden border border-slate-100 shadow-sm cursor-pointer hover:opacity-80 transition" onclick="window.open('${imgUrl}')">
                            <img src="${imgUrl}" class="w-full h-full object-cover">
                        </div>`;
                });

                card.innerHTML = `
                    <div class="h-52 w-full bg-slate-100 relative overflow-hidden">
                        <img src="${post.mainImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
                        <span class="absolute bottom-3 left-3 bg-white/90 backdrop-blur-sm text-slate-800 text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm flex items-center gap-1">
                            📍 ${post.country} ${post.state ? '· ' + post.state : ''} · ${post.city}
                        </span>
                    </div>
                    
                    <div class="p-5 flex-1 flex flex-col justify-between gap-5">
                        <div class="space-y-2">
                            <h4 class="font-bold text-slate-800 text-lg leading-snug">${post.title}</h4>
                            <p class="text-slate-500 text-sm whitespace-pre-wrap leading-relaxed">${post.content}</p>
                        </div>
                        
                        <div class="border-t border-slate-50 pt-4">
                            <span class="block text-[11px] font-bold text-slate-400 mb-2">갤러리 (${post.images.length}장)</span>
                            <div class="flex flex-wrap gap-2">
                                ${allImagesHtml}
                            </div>
                        </div>
                        
                        <div class="text-left text-[11px] text-slate-400">
                            기록일자: ${post.createdAt}
                        </div>
                    </div>
                `;
                postList.appendChild(card);
            });
        }

        // 실시간 연동
        onValue(ref(db, 'my_posts'), (snapshot) => {
            const data = snapshot.val();
            allPosts = [];
            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    allPosts.push(data[key]);
                });
            }
            displayPosts(allPosts);
        });

        // 실시간 통합 검색 기능
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            if (!keyword) {
                displayPosts(allPosts);
                return;
            }
            const filtered = allPosts.filter(post => {
                return post.country.toLowerCase().includes(keyword) || 
                       (post.state && post.state.toLowerCase().includes(keyword)) || 
                       post.city.toLowerCase().includes(keyword);
            });
            displayPosts(filtered);
        });
    </script>
</body>
</html>
